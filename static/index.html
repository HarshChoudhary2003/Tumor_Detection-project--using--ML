<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumor Detection AI Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <header class="glass-header">
            <div class="logo">
                <i class="fa-solid fa-dna"></i>
                <h1>Onco<span>AI</span> Pro</h1>
            </div>
            <div class="status-indicator">
                <span class="pulse"></span>
                <span>System Active</span>
            </div>
        </header>

        <main class="dashboard">
            <section class="control-panel glass-panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-sliders"></i> Diagnostic Input</h2>
                    <button id="autoFillBtn" class="btn-secondary" title="Auto-fill with sample data"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Fill</button>
                </div>
                
                <form id="predictionForm" class="features-form">
                    <div class="feature-groups">
                        <!-- Group 1: Mean Features -->
                        <div class="feature-group">
                            <h3><i class="fa-solid fa-chart-pie"></i> Mean Cell Characteristics</h3>
                            <div class="input-grid" id="mean-features">
                                <!-- Inputs dynamically populated by JS -->
                            </div>
                        </div>

                        <!-- Group 2: Standard Error Features -->
                        <div class="feature-group">
                            <h3><i class="fa-solid fa-chart-line"></i> Standard Error Characteristics</h3>
                            <div class="input-grid" id="se-features">
                                <!-- Inputs dynamically populated by JS -->
                            </div>
                        </div>

                        <!-- Group 3: Worst Features -->
                        <div class="feature-group">
                            <h3><i class="fa-solid fa-chart-bar"></i> Worst Characteristics</h3>
                            <div class="input-grid" id="worst-features">
                                <!-- Inputs dynamically populated by JS -->
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-primary glow-btn" id="predictBtn">
                            <span class="btn-content">
                                <i class="fa-solid fa-microscope"></i>
                                Run Neural Analysis
                            </span>
                            <span class="btn-loader" style="display: none;">
                                <i class="fa-solid fa-circle-notch fa-spin"></i>
                            </span>
                        </button>
                    </div>
                </form>
            </section>

            <section class="results-panel">
                <div class="result-card glass-panel" id="resultCard">
                    <div class="card-glow"></div>
                    <div class="result-header">
                        <i class="fa-solid fa-laptop-medical"></i>
                        <h2>AI Diagnosis Report</h2>
                    </div>
                    
                    <div class="result-content empty-state" id="resultContent">
                        <div class="scanner-animation">
                            <div class="scanner-line"></div>
                            <i class="fa-solid fa-server"></i>
                        </div>
                        <p>Awaiting input parameters for neural analysis...</p>
                    </div>
                </div>

                <div class="system-stats glass-panel">
                    <h3><i class="fa-solid fa-microchip"></i> Model Confidence</h3>
                    <div class="progress-bar-container">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="confidenceBar" style="width: 0%"></div>
                        </div>
                        <span class="progress-value" id="confidenceValue">0.0%</span>
                    </div>
                    
                    <div class="stat-metrics">
                        <div class="stat-item">
                            <span class="stat-label">Model</span>
                            <span class="stat-val">5-Net Ensemble</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Accuracy Base</span>
                            <span class="stat-val">98.83%</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Latency</span>
                            <span class="stat-val" id="latencyVal">-- ms</span>
                        </div>
                    </div>

                    <div class="chart-container" style="position: relative; height:300px; width:100%; margin-top: 2rem;">
                        <canvas id="featureRadarChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
